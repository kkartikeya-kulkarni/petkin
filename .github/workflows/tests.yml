name: Software verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tools and test dependencies
        run: python -m pip install build pytest matplotlib nibabel
      - name: Build distribution
        run: python -m build
      - name: Install wheel
        shell: bash
        run: python -m pip install dist/*.whl
      - name: Verify installed distribution
        run: python -m pytest tests -q --junitxml=test-results.xml
      - name: Check frozen evidence and research status
        run: python scripts/check_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml
