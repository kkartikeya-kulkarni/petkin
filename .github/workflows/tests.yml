name: Software verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-15-intel
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tools and test dependencies
        run: python -m pip install build pytest matplotlib nibabel
      - name: Build distribution
        run: python -m build
      - name: Install wheel
        shell: bash
        run: python -m pip install dist/*.whl
      - name: Verify installed distribution
        run: python -m pytest tests -q --junitxml=test-results.xml
      - name: Check frozen evidence and research status
        run: python scripts/check_release.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml
